# Docker Compose pour la gestion de documents
# Extension du docker-compose.yml principal avec support S3/MinIO optionnel

version: '3.8'

services:
  # Service MinIO optionnel (pour stockage S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: main_courante_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - main_courante_network
    profiles:
      - s3  # Activer avec: docker-compose --profile s3 up

  # Backend avec support documents
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: main_courante_backend
    environment:
      DATABASE_URL: postgresql://maincourante:maincourante_pass@db:5432/main_courante
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      # Configuration stockage documents
      STORAGE_TYPE: ${STORAGE_TYPE:-filesystem}  # filesystem, s3, minio
      STORAGE_PATH: /app/storage/documents
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - documents_storage:/app/storage/documents
    networks:
      - main_courante_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  minio_data:
    driver: local
  documents_storage:
    driver: local

networks:
  main_courante_network:
    external: true

