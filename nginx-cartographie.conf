server {
    listen 80;
    server_name localhost;
    
    # Désactiver les logs pour améliorer les performances
    access_log off;
    error_log /var/log/nginx/error.log;
    
    # Root pour servir les fichiers de cartographie
    root /usr/share/nginx/html;
    
    # Activer la compression gzip pour les fichiers texte
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    
    # Désactiver la compression pour les fichiers binaires (PMTiles)
    gzip_disable "msie6";
    
    # Headers pour le cache des fichiers statiques
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Pas de cache pour version.json (doit toujours être à jour)
    location ~* /json/version\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Access-Control-Allow-Origin * always;
    }
    
    # Configuration spéciale pour les fichiers PMTiles
    # PMTiles nécessite HTTP Byte Serving (Range requests) pour fonctionner correctement
    location ~* \.pmtiles$ {
        # Type MIME pour les fichiers PMTiles
        default_type application/octet-stream;
        
        # Désactiver la compression pour les fichiers binaires (crucial pour Range requests)
        # La compression interfère avec les Range requests car elle modifie la taille du fichier
        gzip off;
        
        # Gérer les requêtes OPTIONS (preflight CORS)
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Range" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        
        # Headers CORS pour toutes les requêtes (GET, HEAD)
        # IMPORTANT: Utiliser 'always' pour que les en-têtes soient présents même pour les codes 206 (Range requests)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Range" always;
        # Exposer les en-têtes nécessaires pour que le client JavaScript puisse les lire
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
        
        # Accept-Ranges - Nginx l'ajoute automatiquement, mais on le force explicitement
        add_header Accept-Ranges bytes always;
        
        # Cache long pour les fichiers PMTiles (ils changent rarement)
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        
        # Optimisations pour les gros fichiers
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        # Nginx gère automatiquement les Range requests pour les fichiers statiques
        # Il renvoie automatiquement:
        # - Code 206 Partial Content pour les Range requests partielles
        # - Code 200 OK pour les requêtes complètes
        # - Content-Range: bytes start-end/total pour les Range requests (206)
        # - Content-Length: taille de la plage demandée (pour Range requests 206) ou taille totale (pour requêtes complètes 200)
        # 
        # IMPORTANT: Nginx renvoie automatiquement Content-Length pour toutes les réponses
        # Le problème pourrait venir du fait que le client ne peut pas lire ces en-têtes à cause de CORS
    }
    
    # Configuration pour les fichiers GeoJSON
    location ~* \.geojson$ {
        gzip on;
        gzip_types application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=3600";
    }
    
    # Gérer les requêtes OPTIONS (preflight CORS) - doit être dans un location
    location / {
        try_files $uri $uri/ =404;
        
        # Gérer les requêtes OPTIONS (preflight CORS)
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Range" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
    }
}

