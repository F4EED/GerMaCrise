services:
  db:
    image: postgis/postgis:16-3.4
    container_name: germacrise_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maincourante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maincourante_pass}
      POSTGRES_DB: ${POSTGRES_DB:-main_courante}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=fr_FR.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./backend/configure_postgres.sql:/docker-entrypoint-initdb.d/configure.sql:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maincourante}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - germacrise_network

  backend:
    # Pour un vrai POC partagé, remplace "build:" par "image:" (GHCR/Docker Hub).
    # Exemples :
    # - image: ghcr.io/<owner>/germacrise-backend:latest
    # - image: <dockerhub_user>/germacrise-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.multiarch
    container_name: germacrise_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-maincourante}:${POSTGRES_PASSWORD:-maincourante_pass}@db:5432/${POSTGRES_DB:-main_courante}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./json:/json:ro
    networks:
      - germacrise_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    # Pour un vrai POC partagé, remplace "build:" par "image:" (GHCR/Docker Hub).
    # Exemples :
    # - image: ghcr.io/<owner>/germacrise-frontend:latest
    # - image: <dockerhub_user>/germacrise-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.multiarch
    container_name: germacrise_frontend
    restart: unless-stopped
    ports:
      # Image multiarch : nginx écoute sur 80 dans le conteneur
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    environment:
      # IMPORTANT : côté navigateur, on doit viser l'hôte du testeur.
      # Pour un test 100% local : http://localhost:${BACKEND_PORT:-8000}
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
      - REACT_APP_API_URL_EXTERNAL=${REACT_APP_API_URL_EXTERNAL:-http://localhost:8000}
      - FAST_REFRESH=false
    networks:
      - germacrise_network

  # Service "one-shot" : initialise la base + charge des données fictives + importe la BAN.
  # Usage recommandé :
  #   docker compose -f docker-compose.poc.yml --env-file .env run --rm seed
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile.multiarch
    container_name: germacrise_seed
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-maincourante}:${POSTGRES_PASSWORD:-maincourante_pass}@db:5432/${POSTGRES_DB:-main_courante}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      BAN_EXPORT_DIR: /json
    volumes:
      - ./json:/json:ro
    networks:
      - germacrise_network
    command: >
      sh -lc "
        set -e;
        echo '==> Init DB (tables + admin)...';
        python -m app.init_db;
        echo '==> Données fictives...';
        python /app/scripts/insert_personnel_fictif.py || true;
        python /app/scripts/insert_moyens_fictifs.py || true;
        python /app/scripts/insert_vehicules_fictifs.py || true;
        python /app/scripts/insert_utilisateurs_fictifs.py || true;
        echo '==> BAN: création table + import des départements manquants depuis /json...';
        psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /app/migrations/create_ban_table.sql;
        python /app/scripts/import_ban_departements_manquants_avec_transformation.py --yes;
        echo '==> Seed terminé.';
      "

  visu:
    image: nginx:alpine
    container_name: germacrise_visu
    restart: unless-stopped
    ports:
      - "${VISU_PORT:-3080}:80"
    volumes:
      - ./visu.html:/usr/share/nginx/html/index.html:ro
      - ./nginx-visu.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - germacrise_network

  cartographie:
    image: nginx:alpine
    container_name: germacrise_cartographie
    restart: unless-stopped
    ports:
      - "${CARTO_PORT:-3081}:80"
    volumes:
      - ./frontend/public/cartographie:/usr/share/nginx/html:ro
      - ./nginx-cartographie.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - germacrise_network

volumes:
  postgres_data:

networks:
  germacrise_network:
    driver: bridge

