services:
  db:
    image: postgis/postgis:16-3.4
    container_name: main_courante_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: maincourante
      POSTGRES_PASSWORD: maincourante_pass
      POSTGRES_DB: main_courante
      # Paramètres PostgreSQL pour augmenter les capacités
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=fr_FR.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/configure_postgres.sql:/docker-entrypoint-initdb.d/configure.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maincourante"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - main_courante_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: main_courante_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://maincourante:maincourante_pass@db:5432/main_courante
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./json:/json
      - ./cartographie:/cartographie
    networks:
      - main_courante_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: main_courante_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_API_URL_EXTERNAL=http://localhost:8000
      - FAST_REFRESH=false
    networks:
      - main_courante_network

  visu:
    image: nginx:alpine
    container_name: main_courante_visu
    restart: unless-stopped
    ports:
      - "3080:80"
    volumes:
      - ./visu.html:/usr/share/nginx/html/index.html:ro
      - ./nginx-visu.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - main_courante_network

  cartographie:
    image: nginx:alpine
    container_name: main_courante_cartographie
    restart: unless-stopped
    ports:
      - "3081:80"
    volumes:
      - ./frontend/public/cartographie:/usr/share/nginx/html:ro
      - ./nginx-cartographie.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - main_courante_network

volumes:
  postgres_data:

networks:
  main_courante_network:
    driver: bridge

